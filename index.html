<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Learning Games</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1565c0 0%, #b71c1c 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #111;
            font-size: 26px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .game-btn {
            display: block;
            background-color: #f5f5f5;
            border: 2px solid #ccc;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            transition: all 0.2s;
        }
        .game-btn:hover {
            background-color: #e0e0e0;
            border-color: #888;
        }
        .spanish-btn {
            border-left: 6px solid #f1bf00;
        }
        .norwegian-btn {
            border-left: 6px solid #00205b;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🌍 Language Games</h1>
    <p>Choose a language to start practicing:</p>
    
    <div class="btn-container">
        <a href="spanish.html" class="game-btn spanish-btn">🇪🇸 Spanish Vocabulary</a>
        <a href="norwegian.html" class="game-btn norwegian-btn">🇳🇴 Norwegian Vocabulary</a>
    </div>
</div>

</body>
</html>
